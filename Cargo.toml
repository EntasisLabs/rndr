[workspace]
resolver = "2"
members = [
    "crates/rndr_core",
    "crates/rndr_paint",
    "crates/rndr_render",
    "crates/rndr_std",
    "examples/expand",
    "examples/idle",
    "examples/overlay",
    "examples/palette",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/EntasisLabs/rndr"

[workspace.dependencies]
rndr_core = { path = "crates/rndr_core" }
rndr_paint = { path = "crates/rndr_paint" }
wgpu = "30"
winit = "0.30"
pollster = "0.4"

[patch.crates-io]
tray-icon = { path = "third_party/tray-icon" }
