[package]
name = "rndr_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Application ECS for rndr: entities, hierarchy, layout, events, tasks, feeds"
documentation = "https://docs.rs/rndr_core"
readme = "README.md"
keywords = ["ecs", "gui", "layout", "desktop", "ui"]
categories = ["gui"]
exclude = ["**/*.snap.new"]

[dependencies]
pulldown-cmark = { version = "0.13.5", default-features = false }
unicode-segmentation = "1.13"
tokio = { version = "1", optional = true, default-features = false, features = ["rt"] }

[features]
default = []
# Thread-pool executor. The desktop runner enables this. The pool does not use tokio.
pool = []
# Spawn a feed producer on a tokio runtime the application already started.
tokio = ["dep:tokio"]
# Color fenced code by token class: comments, strings, numbers, and keywords.
# Off leaves a code block in one color. No extra crates.
highlight = []

[package.metadata.docs.rs]
# `pool` and `highlight` have no native dependencies. `tokio` is optional and pure Rust.
all-features = true
