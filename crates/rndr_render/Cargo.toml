[package]
name = "rndr_render"
version.workspace = true
edition.workspace = true
# Bundled Inter, Noto Sans Arabic, and Noto Color Emoji are OFL-1.1.
# Other `[workspace.package]` fields stay inherited.
license = "MIT AND OFL-1.1"
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "winit + wgpu window plugin for rndr"
documentation = "https://docs.rs/rndr_render"
readme = "README.md"
keywords = ["gui", "wgpu", "winit", "window", "desktop"]
categories = ["gui", "graphics", "rendering"]
exclude = ["**/*.snap.new"]

[[bin]]
name = "rndr-capture"
path = "src/bin/rndr-capture.rs"
required-features = ["observe"]

[features]
# Read-only per-session native surface observation. No listener without app opt-in.
observe = ["dep:serde_json", "dep:getrandom"]
default = ["hotkey", "tray", "parley", "accesskit", "svg", "appearance"]
# System-wide hotkeys. Off skips Carbon, Win32, X11, and the portal client.
hotkey = [
    "dep:futures-util",
    "dep:libc",
    "dep:tokio",
    "dep:windows-sys",
    "dep:x11rb",
    "dep:zbus",
]
# Menu bar, notification area, and StatusNotifierItem icon.
# Linux uses tray-icon's ksni backend (D-Bus on a worker thread), not GTK.
tray = ["dep:tray-icon"]
# Native app menu bar on macOS and Windows through muda. Off by default.
# Linux and the browser have no native bar; draw menus with rndr_ui::menu.
menubar = ["dep:muda"]
# Parley shaping and swash rasterization. Headless tests that do not call
# `run` stay on the builtin atlas engine. `--no-default-features` keeps that
# path and skips the fontconfig link.
parley = ["dep:parley", "dep:swash", "dep:etagere"]
# Accessibility tree on macOS, Windows, and Linux. `--no-default-features` skips it.
accesskit = ["dep:accesskit", "dep:accesskit_unix", "dep:accesskit_macos", "dep:accesskit_windows"]
# Native open and save dialogs. Off by default.
dialog = ["dep:rfd"]
# SVG and SVGZ decoding through resvg. Text in an SVG must be converted to paths.
svg = ["dep:resvg"]
# Follow the desktop's dark/light, accent and reduced-motion settings on Linux
# through the XDG desktop portal (pure-Rust D-Bus on a worker thread). macOS,
# Windows and browsers need no extra dependency.
appearance = ["dep:futures-util", "dep:tokio", "dep:zbus"]
# Desktop notifications. Off by default. Does not enable `dialog` or `browser`.
notify = ["dep:zbus", "zbus/blocking-api"]

[dependencies]
rndr_core = { workspace = true, features = ["pool"] }
rndr_paint = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
pollster = { workspace = true }
web-time = { workspace = true }
parley = { version = "0.12", optional = true, features = ["complex-scripts"] }
swash = { version = "0.2.10", optional = true }
etagere = { version = "0.3", optional = true }
serde_json = { version = "1", optional = true }
getrandom = { version = "0.3", optional = true }
png = "0.18"
jpeg-decoder = "0.3"
image-webp = "0.2"
resvg = { version = "0.45", optional = true, default-features = false }
unicode-segmentation = "1.13"
accesskit = { version = "0.25.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Navigator", "MediaQueryList", "Clipboard", "ClipboardItem", "Blob", "BlobPropertyBag", "HtmlTextAreaElement", "HtmlElement", "CssStyleDeclaration", "DomRect", "Event", "EventTarget", "AddEventListenerOptions", "KeyboardEvent", "KeyboardEventInit", "CompositionEvent", "InputEvent", "ClipboardEvent", "DataTransfer", "FocusEvent", "FocusEventInit"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Hotkeys, tray and notifications have no browser backend; `build.rs` turns
# their features off on wasm32.
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std"] }
libc = { version = "0.2", optional = true }
tokio = { version = "1", optional = true, default-features = false, features = ["macros", "net", "rt", "sync", "time"] }
windows-sys = { version = "0.59", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
x11rb = { version = "0.13.1", optional = true, default-features = false, features = ["allow-unsafe-code", "xkb"] }
zbus = { version = "5", optional = true, default-features = false, features = ["tokio"] }
tray-icon = { version = "0.26.1", optional = true, default-features = false, features = ["ksni"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control", "image-data"] }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = { version = "0.27.2", optional = true }
objc2 = "0.5.2"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSView", "NSResponder", "NSEvent", "NSColor", "NSAccessibility", "NSButton", "NSControl", "NSGraphics", "NSVisualEffectView", "block2"] }
objc2-foundation = { version = "0.2.2", features = ["NSGeometry", "NSString", "NSThread", "NSUserDefaults"] }
block2 = "0.5.1"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.21.2", optional = true, default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
accesskit_unix = { version = "0.24.1", optional = true, default-features = false, features = ["async-io"] }
rfd = { version = "0.15", optional = true, default-features = false, features = ["xdg-portal", "tokio"] }
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
xkbcommon = "0.8"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
accesskit_windows = { version = "0.35.2", optional = true }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(any(target_os = "linux", target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
rfd = { version = "0.15", optional = true }

[dev-dependencies]
insta = "1"

[package.metadata.docs.rs]
# docs.rs uses the crates-build-env image, which includes libfontconfig1-dev,
# libxkbcommon, Wayland, and Vulkan. `parley` links fontconfig on Linux.
# `hotkey` and `tray` do not link libdbus (zbus and x11rb are pure Rust).
all-features = true
