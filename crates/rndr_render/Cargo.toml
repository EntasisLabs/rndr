[package]
name = "rndr_render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "winit + wgpu window plugin for rndr"

[dependencies]
rndr_core = { workspace = true, features = ["pool"] }
rndr_paint = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
pollster = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSWindow", "NSView", "NSResponder"] }
