[package]
name = "rndr_browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Optional embedded browser session for rndr"
documentation = "https://docs.rs/rndr_browser"
readme = "README.md"
keywords = ["browser", "webkit", "webview", "desktop"]
categories = ["gui", "os::macos-apis"]

[features]
default = []
# Explicit distribution opt-in; never enabled by default or by harness features.
macos-private-webkit-artifacts = ["objc2-app-kit/NSBitmapImageRep", "objc2-app-kit/NSImage", "objc2-app-kit/NSImageRep", "objc2-app-kit/NSImageView", "objc2-web-kit/WKURLSchemeHandler", "objc2-web-kit/WKURLSchemeTask", "objc2-foundation/NSData", "objc2-foundation/NSDictionary", "objc2-app-kit/NSGraphics", "objc2-app-kit/NSCell", "objc2-app-kit/NSControl"]
# Main-thread WebKit load used by the macOS authentication harness. Off by default.
native-auth-harness = []
# Opt-in executable with a test-only script observation channel.
native-artifact-harness = ["objc2-web-kit/WKScriptMessage", "objc2-web-kit/WKScriptMessageHandler", "objc2-web-kit/WKUserScript"]

[dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# GTK 3 / WebKitGTK 4.1. Linked only on Linux, and only when this crate is built.
# The facade reaches it through the default-off `browser` feature.
gdkx11 = "=0.18.2"
gtk = "=0.18.2"
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
x11 = { version = "=2.21.0", features = ["xlib"] }

[target.'cfg(target_os = "windows")'.dependencies]
# The loader finds an already installed WebView2 runtime. It is not the runtime.
# A missing runtime is reported. Nothing in this crate downloads or bundles one.
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Same objc2 generation as rndr_render. A newer objc2 would load a second runtime.
block2 = "=0.5.1"
objc2 = "=0.5.2"
objc2-app-kit = { version = "=0.3.2", features = ["block2", "NSEvent", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "=0.2.2", features = [
    "NSArray",
    "NSError",
    "NSGeometry",
    "NSInvocation",
    "NSMethodSignature",
    "NSObject",
    "NSString",
    "NSThread",
    "NSURLAuthenticationChallenge",
    "NSURLError",
    "NSURLCredential",
    "NSURLProtectionSpace",
    "NSURLSession",
    "NSURL",
    "NSURLRequest",
    "NSURLResponse",
] }
objc2-web-kit = { version = "=0.2.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "WKContentRuleList",
    "WKContentRuleListStore",
    "WKUserContentController",
    "WKWebsiteDataStore",
    "WKProcessPool",
    "WKPreferences",
    "WKWindowFeatures",
    "WKDownload",
    "WKDownloadDelegate",
    "WKFrameInfo",
    "WKNavigation",
    "WKNavigationAction",
    "WKNavigationDelegate",
    "WKNavigationResponse",
    "WKOpenPanelParameters",
    "WKSecurityOrigin",
    "WKUIDelegate",
    "WKWebView",
    "WKWebViewConfiguration",
] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "=0.3.2", features = [
    "NSApplication",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "=0.2.2", features = [
    "NSArray",
    "NSDate",
    "NSGeometry",
    "NSRunLoop",
    "NSString",
    "NSThread",
] }
raw-window-handle = "0.6"
winit = { workspace = true }

[[example]]
name = "artifact_policy_harness"
path = "examples/artifact_policy_harness.rs"
required-features = ["native-artifact-harness", "macos-private-webkit-artifacts"]

[[example]]
name = "artifact_scroll_harness"
path = "examples/artifact_scroll_harness.rs"
required-features = ["native-artifact-harness", "macos-private-webkit-artifacts"]

[[example]]
name = "auth_harness"
path = "examples/auth_harness.rs"
required-features = ["native-auth-harness"]

[package.metadata.docs.rs]
# Linux docs.rs cannot link WebKit. The crate still documents the contract.
default-target = "x86_64-unknown-linux-gnu"
all-features = true
