[package]
name = "rndr_paint"
version.workspace = true
edition.workspace = true
# Inter atlas bytes are OFL-1.1. Other `[workspace.package]` fields stay inherited.
license = "MIT AND OFL-1.1"
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "World-to-quad paint step for rndr"
documentation = "https://docs.rs/rndr_paint"
readme = "README.md"
keywords = ["gui", "graphics", "paint", "ui", "2d"]
categories = ["gui", "graphics", "rendering"]
exclude = ["**/*.snap.new"]

[dependencies]
lyon = "1.0"
rndr_core = { workspace = true }

[dev-dependencies]
insta = "1"

[package.metadata.docs.rs]
all-features = true
