[package]
name = "rndr"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Desktop application toolkit: entities, layout, paint, and a window"
documentation = "https://docs.rs/rndr"
readme = "README.md"
keywords = ["gui", "desktop", "ecs", "wgpu", "ui"]
categories = ["gui", "graphics", "rendering"]
exclude = ["**/*.snap.new"]

[features]
# Semantic components under rndr::ui; leaves legacy root exports untouched.
ui = ["dep:rndr_ui"]
# Native read-only observation; still requires explicit per-app session opt-in.
observe = ["rndr_render/observe"]
default = ["hotkey", "tray", "parley", "accesskit", "svg", "appearance"]
# Embedded terminal. Off by default so a desktop build does not link a PTY.
term = ["dep:rndr_term"]
# Same flags as rndr_render. Off skips Carbon, Win32, X11, and the portal client.
hotkey = ["rndr_render/hotkey"]
# Menu bar, notification area, and StatusNotifierItem icon.
tray = ["rndr_render/tray"]
# Parley shaping and swash rasterization. `--no-default-features` keeps the
# builtin atlas and skips the fontconfig link.
parley = ["rndr_render/parley"]
# Accessibility tree. On by default, matching `rndr_render`.
accesskit = ["rndr_render/accesskit"]
# Follow the desktop's dark/light, accent and reduced-motion settings through
# the XDG desktop portal on Linux. On by default, matching `rndr_render`.
appearance = ["rndr_render/appearance"]
# Native open and save dialogs. Off by default.
dialog = ["rndr_render/dialog"]
# Desktop notifications. Off by default. Does not enable `dialog` or `browser`.
notify = ["rndr_render/notify"]
# SVG and SVGZ decoding through resvg. On by default, matching `rndr_render`.
svg = ["rndr_render/svg"]
# Embedded browser. Off by default, so a desktop build does not link a webview.
# Enabling it does not enable `dialog`.
browser = ["dep:rndr_browser"]
# Video and audio playback through rndr::media. Off by default. Links
# GStreamer on Linux and AVFoundation on macOS.
media = ["dep:rndr_media"]
# Spawn a feed producer on a tokio runtime the application already started.
tokio = ["rndr_core/tokio"]
# Charts painted with rndr_paint, under rndr::chart. Off by default.
chart = ["dep:rndr_chart"]
# Liquid Markdown under rndr::liquid: the grammar and, in rndr::liquid::ui, its
# native blocks in markdown views. Enables `chart`. Off by default.
liquid = ["dep:rndr_liquid", "dep:rndr_liquid_ui", "chart"]
# Canvas documents under rndr::canvas, with the painter, editor and panels in
# rndr::canvas::ui. Off by default.
canvas = ["dep:rndr_canvas", "dep:rndr_canvas_ui"]

[dependencies]
# Optional and versioned so `cargo publish` can resolve `ui` from crates.io.
rndr_ui = { workspace = true, optional = true }
rndr_core = { workspace = true }
rndr_paint = { workspace = true }
rndr_std = { workspace = true }
# Path plus version, not workspace = true: turning workspace default features
# off needs Rust 1.99 and edition 2024. This keeps `hotkey` / `tray` / `parley`
# optional on the 2021 edition.
rndr_render = { path = "../rndr_render", version = "0.4.0", default-features = false }
rndr_term = { workspace = true, optional = true }
rndr_browser = { workspace = true, optional = true }
rndr_media = { workspace = true, optional = true }
rndr_chart = { workspace = true, optional = true }
rndr_liquid = { workspace = true, optional = true }
rndr_liquid_ui = { workspace = true, optional = true }
rndr_canvas = { workspace = true, optional = true }
rndr_canvas_ui = { workspace = true, optional = true }

[dev-dependencies]
# Operating gallery only: default applications do not adopt rndr_ui.
# Versioned because `cargo publish` resolves dev-dependencies from the registry.
rndr_ui = { workspace = true }

[[example]]
name = "structured_gallery"
required-features = ["observe", "parley"]

[[example]]
name = "svg_clip_gallery"
required-features = ["svg"]

[[example]]
name = "text_features_gallery"
required-features = ["parley"]

[[example]]
name = "composer_gallery"
required-features = ["parley"]

[package.metadata.docs.rs]
# docs.rs uses the crates-build-env image, which includes libfontconfig1-dev,
# libxkbcommon, Wayland, and Vulkan. `parley` links fontconfig on Linux.
# `hotkey` and `tray` do not link libdbus (zbus and x11rb are pure Rust).
all-features = true
