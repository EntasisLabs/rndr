[package]
name = "rndr_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "GPU-free semantic components, collections and data editors for rndr"
documentation = "https://docs.rs/rndr_ui"
readme = "README.md"
keywords = ["gui", "ui", "components", "ecs", "desktop"]
categories = ["gui"]
exclude = ["**/*.snap.new"]

[dependencies]
rndr_core = { workspace = true }

[dev-dependencies]
rndr_paint = { workspace = true }

[package.metadata.docs.rs]
# GPU-free. No native libraries.
all-features = true
