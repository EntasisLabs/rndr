name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux packages for winit and wgpu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            libfontconfig1-dev
          # fontconfig is the system-font backend parley uses on Linux.
          # The tray feature uses tray-icon's ksni backend (pure Rust D-Bus).
          # It does not link GTK or libappindicator, so no extra -dev packages.

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy without default features
        run: cargo clippy -p rndr_render -p rndr -p rndr_ui --no-default-features --all-targets -- -D warnings

      - name: Clippy with dialogs
        run: cargo clippy -p rndr_render -p rndr --features dialog --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test all features
        run: cargo test --workspace --all-features

      - name: Semantic facade feature configurations
        run: |
          cargo test -p rndr --no-default-features --lib
          cargo test -p rndr --no-default-features --features ui --lib
          cargo test -p rndr --no-default-features --features ui --doc
          cargo test -p rndr --features ui --lib
          cargo test -p rndr --features ui --doc
          cargo clippy -p rndr --no-default-features --features ui --all-targets -- -D warnings

      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with:
          python-version: '3.x'

      # These tests require POSIX permissions, FIFOs and Unix sockets, not only
      # AF_UNIX availability. The live observe transport is unsupported on Windows.
      - name: Python observe protocol and security regressions
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s tools -p 'test_observe*.py' -v

      - name: Feed tokio feature
        run: |
          cargo clippy -p rndr_core --features tokio --all-targets -- -D warnings
          cargo test -p rndr_core --features tokio

      - name: Test markdown code coloring
        run: cargo test -p rndr_core --features highlight

      - name: Build examples and rndr_render
        run: cargo build -p expand -p idle -p overlay -p palette -p terminal -p stream -p two-windows -p pen-probe -p canvas-scene -p create-view -p rndr_render

      - name: Build native semantic galleries with observation
        run: cargo build -p rndr --features observe,ui --example ui_gallery --example data_gallery --example data_editors_gallery --example selection_gallery --example virtual_list_gallery

      # Archive-only: unpublished optional UI prevents registry lockfile/build
      # verification even with ui disabled. Keep facade normalization, membership
      # and source-integrity coverage; never call this release readiness.
      - name: Facade archive regression (not registry build verification)
        if: runner.os == 'Linux'
        run: python3 scripts/check-facade-archive.py

      - name: Package and docs
        if: runner.os == 'Linux'
        run: |
          # rndr_ui stays publish=false. Its version+path metadata lets the
          # facade normalize, but cannot supply a registry release. The facade
          # archive is checked above; registry build verification remains blocked.
          # Builds each packaged crate from the tarball. Cargo does not execute
          # tests here, so the archive checks below guard the snapshot suite.
          cargo package --workspace --locked --exclude rndr_ui --exclude rndr --exclude expand --exclude idle --exclude overlay --exclude palette --exclude terminal --exclude stream --exclude two-windows --exclude pen-probe --exclude canvas-scene --exclude create-view
          paint_crate=(target/package/rndr_paint-*.crate)
          render_crate=(target/package/rndr_render-*.crate)
          test "${#paint_crate[@]}" -eq 1
          test "${#render_crate[@]}" -eq 1
          paint_files="$(tar -tzf "${paint_crate[0]}")"
          render_files="$(tar -tzf "${render_crate[0]}")"
          test "$(printf '%s\n' "$paint_files" | grep -c '\.snap$')" = 7
          test "$(printf '%s\n' "$render_files" | grep -c '\.snap$')" = 2
          printf '%s\n' "$paint_files" | grep -q '/Inter-LICENSE.txt$'
          printf '%s\n' "$paint_files" | grep -q '/latin_atlas.bin$'
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features --locked --exclude expand --exclude idle --exclude overlay --exclude palette --exclude terminal --exclude stream --exclude two-windows --exclude pen-probe --exclude canvas-scene --exclude create-view
