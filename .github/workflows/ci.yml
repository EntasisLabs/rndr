name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Debug info and incremental state fill the Linux runner's disk (the linker
  # dies with SIGBUS, then the runner reports "No space left on device").
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free Linux runner disk space
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Fork pull requests may restore this repository's cache. They must not
      # save into it. Same-repository pulls still save. cache-on-failure stays
      # off so a failed job does not publish a partial cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: false
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Install Linux packages for winit and wgpu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            libfontconfig1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            xvfb
          # GStreamer is rndr_media's Linux backend; its tests encode Theora
          # and Vorbis clips with plugins-base and play through plugins-good.
          # fontconfig is the system-font backend parley uses on Linux.
          # The tray feature uses tray-icon's ksni backend (pure Rust D-Bus).
          # It does not link GTK or libappindicator, so no extra -dev packages.

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy without default features
        run: cargo clippy -p rndr_render -p rndr -p rndr_ui --no-default-features --all-targets -- -D warnings

      - name: Clippy with dialogs
        run: cargo clippy -p rndr_render -p rndr --features dialog --all-targets -- -D warnings

      - name: Clippy for the browser (wasm32)
        if: runner.os == 'Linux'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy -p rndr_render -p rndr -p web-hello --target wasm32-unknown-unknown -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Browser authentication dispatch in release
        if: runner.os == 'macOS'
        run: cargo test -p rndr_browser --release --lib challenge_dispatch

      - name: WebKit certificate harness
        if: runner.os == 'macOS'
        run: |
          cargo run -p rndr_browser --features native-auth-harness --example auth_harness
          cargo run -p rndr_browser --features native-auth-harness --example auth_harness --release

      - name: WebView2 smoke
        if: runner.os == 'Windows'
        run: cargo run -p rndr_browser --example windows_smoke

      - name: WebKitGTK X11 smoke
        if: runner.os == 'Linux'
        run: |
          cargo test -p rndr_browser --example webkitgtk_smoke
          xvfb-run -a cargo run -p rndr_browser --example webkitgtk_smoke

      - name: Test all features
        run: cargo test --workspace --all-features

      - name: Semantic facade feature configurations
        run: |
          cargo test -p rndr --no-default-features --lib
          cargo test -p rndr --no-default-features --features ui --lib
          cargo test -p rndr --no-default-features --features ui --doc
          cargo test -p rndr --features ui --lib
          cargo test -p rndr --features ui --doc
          cargo clippy -p rndr --no-default-features --features ui --all-targets -- -D warnings
          cargo test -p rndr --no-default-features --features liquid,canvas --lib
          cargo clippy -p rndr --no-default-features --features liquid,canvas --all-targets -- -D warnings

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os != 'Windows'
        with:
          python-version: '3.x'

      # These tests require POSIX permissions, FIFOs and Unix sockets, not only
      # AF_UNIX availability. The live observe transport is unsupported on Windows.
      - name: Python observe protocol and security regressions
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s tools -p 'test_observe*.py' -v

      - name: Feed tokio feature
        run: |
          cargo clippy -p rndr_core --features tokio --all-targets -- -D warnings
          cargo test -p rndr_core --features tokio

      - name: Test markdown code coloring
        run: cargo test -p rndr_core --features highlight

      - name: Build examples and rndr_render
        run: cargo build -p desktop -p expand -p idle -p overlay -p palette -p terminal -p stream -p two-windows -p titlebar -p lifecycle -p pen-probe -p canvas-scene -p create-view -p chart-gallery -p liquid-view -p canvas-editor -p rndr_render

      - name: Build native semantic galleries with observation
        run: cargo build -p rndr --features observe,ui --example ui_gallery --example data_gallery --example data_editors_gallery --example selection_gallery --example virtual_list_gallery --example markdown_gallery --example item_drag

      - name: Build capture CLI and capture examples
        run: |
          cargo build -p rndr_render --features observe --bin rndr-capture
          cargo build -p rndr --features observe,ui --example component_capture --example structured_gallery

      - name: Desktop packaging control-flow regression (mock tools)
        if: runner.os == 'Linux'
        run: python3 scripts/check-desktop-packaging.py

      # Facade manifest normalization. Registry rebuild waits until 0.6.0
      # dependencies are on the index; scripts/publish-crates.sh does that in order.
      - name: Facade archive normalization
        if: runner.os == 'Linux'
        run: python3 scripts/check-facade-archive.py

      - name: Package and docs
        if: runner.os == 'Linux'
        run: |
          # --no-verify: 0.6.0 path dependencies are not on crates.io until
          # publish. The tarball checks below still run. Ordered registry
          # verification is scripts/publish-crates.sh.
          # Excludes are derived from publish = false members; the archive-set
          # check rejects both missing and unexpected .crate files (including
          # unpublished examples such as titlebar).
          python3 scripts/check-package-archives.py --self-test
          python3 scripts/check-package-archives.py --run-package --contents
          paint_crate=(target/package/rndr_paint-*.crate)
          render_crate=(target/package/rndr_render-*.crate)
          ui_crate=(target/package/rndr_ui-*.crate)
          app_crate=(target/package/rndr_app-*.crate)
          # Digit after the hyphen keeps rndr-flow out of the facade glob.
          facade_crate=(target/package/rndr-[0-9]*.crate)
          flow_crate=(target/package/rndr-flow-*.crate)
          browser_crate=(target/package/rndr_browser-*.crate)
          media_crate=(target/package/rndr_media-*.crate)
          test "${#paint_crate[@]}" -eq 1
          test "${#render_crate[@]}" -eq 1
          test "${#ui_crate[@]}" -eq 1
          test "${#app_crate[@]}" -eq 1
          test "${#facade_crate[@]}" -eq 1
          test "${#flow_crate[@]}" -eq 1
          test "${#browser_crate[@]}" -eq 1
          test "${#media_crate[@]}" -eq 1
          paint_files="$(tar -tzf "${paint_crate[0]}")"
          render_files="$(tar -tzf "${render_crate[0]}")"
          media_files="$(tar -tzf "${media_crate[0]}")"
          test "$(printf '%s\n' "$paint_files" | grep -c '\.snap$')" = 8
          test "$(printf '%s\n' "$render_files" | grep -c '\.snap$')" = 2
          printf '%s\n' "$paint_files" | grep -q '/Inter-LICENSE.txt$'
          printf '%s\n' "$paint_files" | grep -q '/latin_atlas.bin$'
          printf '%s\n' "$paint_files" | grep -q '/Lucide-LICENSE.txt$'
          printf '%s\n' "$paint_files" | grep -q '/icon_atlas.bin$'
          printf '%s\n' "$media_files" | grep -q '/LICENSE$'
          # Doc excludes match unpublished examples so rustdoc does not walk them.
          # shellcheck disable=SC2046
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features --locked \
            $(python3 scripts/check-package-archives.py --print-excludes)
