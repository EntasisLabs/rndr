[package]
name = "create-view"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Read-only viewer for a saved Create scene"

[dependencies]
base64 = "0.23"
rndr_canvas = { workspace = true }
rndr_canvas_ui = { workspace = true }
rndr_core = { workspace = true }
rndr_paint = { workspace = true }
rndr_render = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
resvg = "0.45"
